<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки | Мой Профессиональный Сайт</title>
  <style>
body {
            margin: 0;
            font-family: sans-serif;
        }

        .nav-header {
            background-color: black;
            color: #fff;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .hamburger-button {
            width: 30px;
            height: 20px;
            position: relative;
            cursor: pointer;
            border: none;
            background: transparent;
            outline: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .line {
            width: 100%;
            height: 3px;
            background-color: #fff;
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
        }

        .hamburger-button.open .line1 {
            transform: translateY(8px) rotate(45deg);
        }

        .hamburger-button.open .line2 {
            opacity: 0;
        }

        .hamburger-button.open .line3 {
            transform: translateY(-8px) rotate(-45deg);
        }

        .slide-menu {
            height: 100%;
            width: 0;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #fdfdfd;
            overflow-x: hidden;
            transition: width 0.5s ease-in-out;
            padding-top: 60px;
            color: #2c3e50;
            display: flex; /* Используем Flexbox для меню */
            flex-direction: column; /* Пункты меню располагаем вертикально */
            box-shadow: 2px 0px 5px rgba(0, 0, 0, 0.1);
        }

        .slide-menu a {
            padding: 15px 20px;
            text-decoration: none;
            font-size: 18px;
            color: #2c3e50;
            display: block;
            transition: background-color 0.3s ease-in-out;
        }

        .slide-menu a:hover {
            background-color: #ecf0f1;
        }

        .slide-menu .close-button {
            position: absolute;
            top: 0;
            right: 25px;
            font-size: 36px;
            margin-left: 50px;
            color: #2c3e50;
            text-decoration: none;
            opacity: 0.7;
            transition: opacity 0.3s ease-in-out;
        }

        .slide-menu .close-button:hover {
            opacity: 1;
        }

        .menu-header {
            padding: 20px;
            font-weight: bold;
            color: #7f8c8d;
            border-bottom: 1px solid #bdc3c7;
            margin-bottom: 10px;
        }

        .content {
            padding: 20px;
        }
  {
    font-family: sans-serif;
            display: flex;
        }

        .sidebar {
            width: 200px;
            border-right: 1px solid #ccc;
            padding: 15px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar li {
            padding: 8px 0;
            cursor: pointer;
        }

        .sidebar li:hover {
            background-color: #f0f0f0;
        }

        .content {
            flex-grow: 1;
            padding: 15px;
        }

        #info-container {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 10px;
        }
.page-title {
    font-size: 2.5rem;
    color: #212529;
    margin-bottom: 1.5rem;
    text-align: center;
}

#settings-form {
    background-color: #fff;
    padding: 2rem;
    border-radius: 0.5rem;
    box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
}

section {
    margin-bottom: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid #dee2e6;
}

section:last-child {
    border-bottom: none;
}

h2 {
    font-size: 1.75rem;
    color: #212529;
    margin-top: 0;
    margin-bottom: 1rem;
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: bold;
    color: #495057;
}

.form-label-inline {
    font-weight: normal;
    margin-left: 0.5rem;
}

.form-control {
    display: block;
    width: 100%;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    line-height: 1.5;
    color: #495057;
    background-color: #fff;
    background-clip: padding-box;
    border: 1px solid #ced4da;
    border-radius: 0.25rem;
    transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
}

.form-control:focus {
    color: #495057;
    background-color: #fff;
    border-color: #80bdff;
    outline: 0;
    box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
}

.select-wrapper {
    position: relative;
}

.select-wrapper select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    padding-right: 2.5rem;
}

.select-wrapper .icon {
    position: absolute;
    top: 50%;
    right: 1rem;
    transform: translateY(-50%);
    width: 1em;
    height: 1em;
    pointer-events: none;
    fill: #6c757d;
}

.input-group {
    display: flex;
    align-items: center;
}

.input-group .form-control {
    flex-grow: 1;
    border-radius: 0.25rem 0 0 0.25rem;
}

.input-group-addon {
    padding: 0.75rem 1rem;
    font-size: 1rem;
    font-weight: normal;
    line-height: 1.5;
    color: #495057;
    text-align: center;
    background-color: #e9ecef;
    border: 1px solid #ced4da;
    border-radius: 0 0.25rem 0.25rem 0;
}

.checkbox-group {
    display: flex;
    align-items: center;
}

.form-checkbox {
    margin-right: 0.5rem;
}

/* Действия формы */
.form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 1rem;
    padding-top: 1.5rem;
}

.button {
    display: inline-block;
    font-weight: 400;
    color: #fff;
    text-align: center;
    vertical-align: middle;
    cursor: pointer;
    background-color: transparent;
    border: 1px solid transparent;
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
    line-height: 1.5;
    border-radius: 0.25rem;
    transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
}

.button-primary {
    background-color: #007bff;
    border-color: #007bff;
}

.button-primary:hover {
    background-color: #0056b3;
    border-color: #0056b3;
}

.button-secondary {
    color: #6c757d;
    background-color: #e9ecef;
    border-color: #e9ecef;
}

.button-secondary:hover {
    color: #495057;
    background-color: #d3d9df;
    border-color: #d3d9df;
}

/* Подвал */
.app-footer {
    background-color: #343a40;
    color: #fff;
    text-align: center;
    padding: 1rem 0;
    margin-top: 2rem;
}

/* Адаптивный дизайн (пример) */
@media (max-width: 768px) {
    .main-nav ul {
        flex-direction: column;
        text-align: center;
    }

    .main-nav li {
        margin: 0.5rem 0;
    }

    .form-actions {
        flex-direction: column;
        gap: 0.5rem;
    }

    .form-label {
        text-align: left;
    }
}

  </style>
</head>

            <div class="container">

                    <section aria-labelledby="appearance-heading">

                        <div class="form-group">
                            <label for="theme" class="form-label">Тема:</label>

                                <select id="theme" name="theme" class="form-control">

                                <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
                            </div>
                        </div>
                        <div class="form-group">

                        <div class="form-group">

                    </section>

                    <section aria-labelledby="notifications-heading">

                        <div class="form-group">
                            <div class="checkbox-group">
                                <input type="checkbox" id="emailNotifications" name="emailNotifications" class="form-checkbox" checked>
                                <label for="emailNotifications" class="form-label-inline">Уведомления по электронной почте</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="checkbox-group">
                                <input type="checkbox" id="pushNotifications" name="pushNotifications" class="form-checkbox">
                                <label for="pushNotifications" class="form-label-inline">Push-уведомления</label>
                            </div>
                        </div>
                    </section>

                    <section aria-labelledby="account-heading">
                        <h2 id="account-heading">Аккаунт</h2>
                        <div class="form-group">
                            <label for="language" class="form-label">Язык:</label>
                            <div class="select-wrapper">
                                <select id="language" name="language" class="form-control">

                            </div>

                        <div class="form-group">
                            <label for="about" class="form-label">О себе:</label>
                            <textarea id="about" name="about" rows="5" cols="30" class="form-control"></textarea>
                        </div>
                    </section>

                    <div class="form-actions">
                        <button type="submit" class="button button-primary">Сохранить настройки</button>
                        <button type="reset" class="button button-secondary">Сбросить</button>
                    </div>
                </form>
            </div>
        </main>

        
    </div>

    <script>
  document.addEventListener('DOMContentLoaded', () => {
    const settingsForm = document.getElementById('settings-form');

    if (settingsForm) {
        settingsForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const formData = new FormData(settingsForm);
            const settings = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/api/settings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(settings),
                });
